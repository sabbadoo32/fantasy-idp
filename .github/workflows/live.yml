name: publish-live
# Frequent live-score publish (Sleeper + ESPN, no parquet). Pushes site-data/live.json to the
# gh-pages branch under /data, which Netlify proxies — so the app updates with no redeploy.
# GitHub's scheduler enforces a ~5-min floor and can delay under load.
on:
  schedule:
    - cron: "*/5 * * * 0,1,4"   # every 5 min, Sun/Mon/Thu (US game days), UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python src/publish_data.py live
      - name: Publish live.json to gh-pages/data
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-data
          destination_dir: data
          keep_files: true          # don't wipe matchups.json published by the daily job
          commit_message: "live: ${{ github.run_id }}"
